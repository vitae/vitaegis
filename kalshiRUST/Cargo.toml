[package]
name = "kalshi_btc_bot"
version = "0.1.0"
edition = "2021"
default-run = "kalshi_btc_bot"

[lib]
name = "kalshi_btc_bot"
path = "src/lib.rs"

[[bin]]
name = "kalshi_btc_bot"
path = "src/main.rs"

[[bin]]
name = "backtest"
path = "src/bin/backtest.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
dotenvy = "0.15"
env_logger = "0.10"
log = "0.4"
ring = "0.17"
base64 = "0.21"
chrono = { version = "0.4", features = ["serde"] }
statrs = "0.19.1"
